<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="/static/style.css"></head>
<body>
{% include 'dashboard_nav.html' %}
<div class="main">
<h1>签证业务</h1>
<form method="post" class="form-box">
<input name="name" placeholder="客户姓名">
<input name="visa_type" placeholder="签证类型">
<input name="progress" placeholder="进度">
<input name="profit" placeholder="利润">
<input name="note" placeholder="备注">
<button type="submit">新增</button>
</form>
<table>
<tr><th>姓名</th><th>签证类型</th><th>利润</th></tr>
{% for row in data %}
<tr>
<td>{{ row["name"] }}</td>
<td>{{ row["visa_type"] }}</td>
<td>{{ row["profit"] }}</td>
</tr>
{% endfor %}
</table>
</div>
</body>
</html>
