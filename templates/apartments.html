<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="sidebar">
<h2>业务后台系统</h2>
<a href=" ">仪表盘</a >
<a href="/customers">客户预约找房</a >
<a href="/pending">拟找房客户</a >
<a href="/landlords">房东信息</a >
<a href="/apartments">公寓出租情况</a >
</div>

<div class="main">
<h1>公寓出租情况</h1>

<table>
<tr>
<th>公寓</th>
<th>状态</th>
<th>客户</th>
<th>租金</th>
<th>利润</th>
<th>入住日期</th>
<th>到期日期</th>
<th>操作</th>
</tr>

{% for row in data %}
<tr>
<form method="post">
<td>{{ row[1] }}<input type="hidden" name="id" value="{{ row[0] }}"></td>
<td><input name="status" value="{{ row[2] }}"></td>
<td><input name="customer" value="{{ row[3] or '' }}"></td>
<td><input name="rent" value="{{ row[4] or '' }}"></td>
<td><input name="profit" value="{{ row[5] or '' }}"></td>
<td><input name="checkin" value="{{ row[6] or '' }}"></td>
<td><input name="checkout" value="{{ row[7] or '' }}"></td>
<td><button type="submit">保存</button></td>
</form>
</tr>
{% endfor %}
</table>

</div>
</body>
</html>
