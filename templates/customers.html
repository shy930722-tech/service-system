<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="/static/style.css"></head>
<body>
{% include 'dashboard_nav.html' %}
<div class="main">
<h1>客户预约</h1>
<form method="post" class="form-box">
<input name="name" placeholder="姓名">
<input name="wechat" placeholder="微信">
<input name="phone" placeholder="电话">
<input name="checkin" placeholder="入住日期">
<input name="room_type" placeholder="房型">
<input name="duration" placeholder="租期">
<input name="area" placeholder="区域">
<input name="budget" placeholder="预算">
<input name="request" placeholder="要求">
<input name="profit" placeholder="利润">
<input name="status" placeholder="状态">
<button type="submit">新增</button>
</form>
<table>
<tr><th>姓名</th><th>微信</th><th>电话</th><th>利润</th><th>状态</th></tr>
{% for row in data %}
<tr>
<td>{{ row["name"] }}</td>
<td>{{ row["wechat"] }}</td>
<td>{{ row["phone"] }}</td>
<td>{{ row["profit"] }}</td>
<td>{{ row["status"] }}</td>
</tr>
{% endfor %}
</table>
</div>
</body>
</html>
