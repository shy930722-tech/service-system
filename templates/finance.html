<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="sidebar">
    <h2>业务后台系统</h2>
    <a href=" ">仪表盘</a >
    <a href="/customers">客户预约</a >
    <a href="/apartments">公寓管理</a >
    <a href="/finance">财务统计</a >
</div>

<div class="main">
    <h1>财务统计</h1>

    <div class="table-box">
        <table>
            <tr>
                <th>业务</th>
                <th>利润</th>
            </tr>
            <tr><td>客户找房</td><td>{{ profits["customers"] }}</td></tr>
            <tr><td>车辆业务</td><td>{{ profits["cars"] }}</td></tr>
            <tr><td>签证业务</td><td>{{ profits["visa"] }}</td></tr>
            <tr><td>跑腿业务</td><td>{{ profits["errands"] }}</td></tr>
            <tr><td>公寓利润</td><td>{{ profits["apartments"] }}</td></tr>
            <tr><th>总利润</th><th>{{ total }}</th></tr>
        </table>
    </div>
</div>

</body>
</html>
